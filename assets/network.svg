  <rect x="52" y="54" width="416" height="312" rx="22" fill="none" stroke="#71c0b5" stroke-width="1.2" stroke-dasharray="5 9" opacity=".38"/>
  <text x="260" y="46" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5" letter-spacing="2.6" fill="#71c0b5" opacity=".85">MISMA RED · mDNS</text>

  <!-- router -->
  <rect x="222" y="96" width="76" height="42" rx="8" fill="#1d1f24" stroke="#4b505b" stroke-width="1.4"/>
  <path d="M238 96l-10-20M282 96l10-20" stroke="#4b505b" stroke-width="1.4" stroke-linecap="round"/>
  <circle cx="244" cy="117" r="2.2" fill="#6385d5"/>
  <circle cx="253" cy="117" r="2.2" fill="#71c0b5"/>
  <circle cx="262" cy="117" r="2.2" fill="#4b505b"/>
