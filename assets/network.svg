  <path d="M254 76a26 26 0 0 1 12 0" stroke="#6385d5" stroke-width="1.2" fill="none" stroke-linecap="round" opacity=".3"/>

  <!-- enlaces -->
  <path d="M232 138c-40 34-58 62-74 84" stroke="#585d6a" stroke-width="1.3" stroke-dasharray="4 7" fill="none" stroke-linecap="round"/>
  <path d="M288 138c40 34 58 62 74 84" stroke="#585d6a" stroke-width="1.3" stroke-dasharray="4 7" fill="none" stroke-linecap="round"/>
  <circle cx="176" cy="200" r="2.6" fill="#6385d5"/>
  <circle cx="344" cy="200" r="2.6" fill="#71c0b5"/>

  <!-- portátil -->
  <rect x="92" y="238" width="126" height="84" rx="5" fill="#1b1d22" stroke="#4b505b" stroke-width="1.4"/>
  <rect x="100" y="246" width="110" height="68" rx="2" fill="#22252b" stroke="#343841"/>
  <rect x="108" y="254" width="40" height="52" rx="2" fill="#282b33"/>
  <rect x="154" y="254" width="46" height="5" rx="2" fill="#3e434d"/>
  <rect x="154" y="265" width="36" height="5" rx="2" fill="#353943"/>
  <rect x="154" y="276" width="42" height="5" rx="2" fill="#353943"/>
  <rect x="154" y="287" width="26" height="5" rx="2" fill="#6385d5" opacity=".55"/>
  <path d="M80 322h150l12 15H68z" fill="#1c1e23" stroke="#4b505b" stroke-width="1.4" stroke-linejoin="round"/>
  <text x="155" y="366" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5" letter-spacing="2.4" fill="#6c7280">EQUIPO</text>

