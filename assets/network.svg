  <rect x="342" y="254" width="36" height="38" rx="2" fill="#282b33"/>
  <rect x="384" y="254" width="42" height="5" rx="2" fill="#3e434d"/>
  <rect x="384" y="265" width="32" height="5" rx="2" fill="#353943"/>
