<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 420" role="img" aria-label="El equipo y el televisor conectados al mismo router en la red local">
  <defs>
    <radialGradient id="n-glow" cx="0.5" cy="0.4" r="0.6">
      <stop offset="0" stop-color="#6385d5" stop-opacity=".10"/>
