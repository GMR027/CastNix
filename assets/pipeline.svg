<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 260" role="img" aria-label="Flujo: captura de pantalla, codificación H.264 y envío a la televisión">
  <defs>
    <linearGradient id="p-panel" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#1e2026"/>
      <stop offset="1" stop-color="#17191d"/>
    </linearGradient>
  </defs>

  <rect x="20" y="20" width="1060" height="220" rx="16" fill="#141519" stroke="#25272d"/>

  <g fill="none" stroke="#585d6a" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
    <!-- nodo 1: monitor -->
    <rect x="106" y="58" width="88" height="88" rx="14" fill="url(#p-panel)" stroke="#444853"/>
    <rect x="128" y="84" width="44" height="30" rx="3" stroke="#6385d5" stroke-width="1.3"/>
    <path d="M142 120v6M136 127h28" stroke="#6385d5" stroke-width="1.2"/>
    <path d="M120 136h60" stroke="#353942" stroke-width="1.2"/>

    <!-- nodo 2: códec -->
    <rect x="506" y="58" width="88" height="88" rx="14" fill="url(#p-panel)" stroke="#444853"/>
    <rect x="530" y="86" width="40" height="28" rx="3" stroke="#71c0b5" stroke-width="1.3"/>
    <path d="M538 80v6M562 80v6M538 114v6M562 114v6" stroke="#71c0b5" stroke-width="1.2"/>
    <path d="M540 96h6M554 96h6M540 104h6M554 104h6" stroke="#71c0b5" stroke-width="1.6"/>

    <!-- nodo 3: tv -->
    <rect x="906" y="58" width="88" height="88" rx="14" fill="url(#p-panel)" stroke="#444853"/>
    <rect x="924" y="80" width="52" height="36" rx="4" stroke="#6385d5" stroke-width="1.3"/>
    <path d="M950 116v8M936 126h28" stroke="#6385d5" stroke-width="1.2"/>
    <path d="M932 94h36M932 102h24" stroke="#444853" stroke-width="1.2"/>

    <!-- conectores -->
    <path d="M212 102h276" stroke-dasharray="3 8" stroke="#5f6572"/>
    <path d="M612 102h276" stroke-dasharray="3 8" stroke="#5f6572"/>
  </g>

  <path d="M488 102l-9-5v10z" fill="#6385d5"/>
  <path d="M888 102l-9-5v10z" fill="#6385d5"/>
  <circle cx="350" cy="102" r="3" fill="#6385d5" opacity=".7"/>
  <circle cx="750" cy="102" r="3" fill="#71c0b5" opacity=".7"/>

  <!-- ondas -->
  <g stroke="#3e434d" stroke-width="1.6" stroke-linecap="round">
    <path d="M308 168v-6M318 168v-14M328 168v-22M338 168v-12M348 168v-18M358 168v-8M368 168v-16M378 168v-6"/>
    <path d="M708 168v-8M718 168v-16M728 168v-10M738 168v-24M748 168v-14M758 168v-20M768 168v-6M778 168v-12"/>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">
    <text x="150" y="196" font-size="11" letter-spacing="3" fill="#a2a7b4">CAPTURA</text>
    <text x="150" y="214" font-size="9.5" letter-spacing="1.1" fill="#636875">pipewiresrc · ximagesrc</text>

    <text x="550" y="196" font-size="11" letter-spacing="3" fill="#a2a7b4">CODIFICA</text>
    <text x="550" y="214" font-size="9.5" letter-spacing="1.1" fill="#636875">x264enc · perfil I420</text>

    <text x="950" y="196" font-size="11" letter-spacing="3" fill="#a2a7b4">ENVÍA</text>
    <text x="950" y="214" font-size="9.5" letter-spacing="1.1" fill="#636875">puerto 7000 · 8009</text>

    <text x="150" y="44" font-size="9.5" letter-spacing="2" fill="#50545e">01</text>
    <text x="550" y="44" font-size="9.5" letter-spacing="2" fill="#50545e">02</text>
    <text x="950" y="44" font-size="9.5" letter-spacing="2" fill="#50545e">03</text>
  </g>
